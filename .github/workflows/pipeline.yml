
name: Pipeline de Testes - Missão Marte

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  testes:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configurar Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          install-chromedriver: false

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar testes e medir cobertura
        run: |
          python -m pytest -v \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml

      - name: Salvar screenshots de falhas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-testes
          path: screenshots/
          if-no-files-found: ignore

      - name: Salvar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-cobertura
          path: coverage.xml
          if-no-files-found: ignore
